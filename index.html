<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>How well do you know America?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F5F7;
    --surface: #FFFFFF;
    --ink: #14213D;
    --muted: #5B6578;
    --rule: #D5DAE1;
    --accent: #2F5D9E;
    --accent-soft: #E6EDF7;
    --right: #2E7D4F;
    --right-soft: #E5F2EA;
    --wrong: #B3261E;
    --wrong-soft: #F8E6E4;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "Public Sans", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #10161F;
      --surface: #18202C;
      --ink: #E7ECF3;
      --muted: #9AA5B6;
      --rule: #2C3646;
      --accent: #7FA8E0;
      --accent-soft: #1F2E45;
      --right: #6CC08F;
      --right-soft: #1A3326;
      --wrong: #F08A80;
      --wrong-soft: #3A1F1D;
      color-scheme: dark;
    }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-padding-top: 1rem; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    padding: 0 1rem 5rem;
  }

  /* Scroll progress bar */
  .scroll-progress {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: var(--rule);
    z-index: 20;
  }
  .scroll-progress span {
    display: block;
    height: 100%;
    background: var(--accent);
    transform-origin: left center;
    transform: scaleX(0);
  }

  .wrap { max-width: 700px; margin: 0 auto; }

  header { padding: 4rem 0 2.5rem; }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(2rem, 6vw, 3rem);
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  .intro {
    margin-top: 1rem;
    max-width: 34em;
    color: var(--muted);
    font-size: 1.05rem;
  }

  ol.questions { list-style: none; counter-reset: q; }

  .card {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-left: 4px solid var(--rule);
    border-radius: 6px;
    padding: 1.5rem 1.5rem 1.25rem;
    margin-bottom: 1rem;
  }
  .card.is-right { border-left-color: var(--right); }
  .card.is-wrong { border-left-color: var(--wrong); }
  .card.is-pending { border-left-color: var(--accent); }

  .q-num { font-size: 0.85rem; font-weight: 600; color: var(--muted); }
  .q-text {
    font-family: var(--serif);
    font-size: 1.2rem;
    line-height: 1.45;
    margin-top: 0.25rem;
  }
  .q-note {
    font-size: 0.9rem;
    color: var(--muted);
    margin-top: 0.5rem;
  }

  .figures {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.75rem;
    margin-top: 1rem;
  }
  .figures figure { display: flex; flex-direction: column; gap: 0.35rem; }
  .figures img {
    width: 100%; aspect-ratio: 4 / 3; object-fit: cover;
    border: 1px solid var(--rule); border-radius: 4px;
  }
  .placeholder {
    width: 100%; aspect-ratio: 4 / 3;
    border: 1px dashed var(--rule); border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; color: var(--muted); text-align: center; padding: 0.5rem;
    background: var(--bg);
  }
  figcaption { font-size: 0.85rem; color: var(--muted); text-align: center; }

  .options { display: grid; gap: 0.5rem; margin-top: 1.1rem; }
  .option {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.7rem 0.9rem;
    border: 1px solid var(--rule);
    border-radius: 4px;
    cursor: pointer;
    font-size: 0.98rem;
  }
  .option:hover { border-color: var(--accent); }
  .option input { accent-color: var(--accent); width: 1rem; height: 1rem; flex-shrink: 0; }
  .option:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .option:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); }
  .letter { font-weight: 600; min-width: 1.1rem; }

  .locked .option { cursor: default; }
  .locked .option:hover { border-color: var(--rule); }
  .option.correct-answer { background: var(--right-soft); border-color: var(--right); }
  .option.picked-wrong { background: var(--wrong-soft); border-color: var(--wrong); }

  .feedback { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--rule); font-size: 0.95rem; }
  .verdict { font-weight: 700; }
  .is-right .verdict { color: var(--right); }
  .is-wrong .verdict { color: var(--wrong); }
  .is-pending .verdict { color: var(--accent); }
  .explain { margin-top: 0.35rem; }
  .sources { margin-top: 0.5rem; font-size: 0.85rem; color: var(--muted); }
  .sources a { color: var(--accent); }

  .submit-area { margin-top: 2rem; display: flex; flex-direction: column; align-items: center; gap: 0.75rem; }
  .answered { font-size: 0.9rem; color: var(--muted); }
  button {
    font-family: var(--sans);
    font-size: 1rem; font-weight: 600;
    padding: 0.8rem 2.5rem;
    border: none; border-radius: 4px;
    background: var(--ink); color: var(--bg);
    cursor: pointer;
  }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .score {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 1.75rem;
    text-align: center;
  }
  .score-num { font-family: var(--serif); font-size: 3rem; font-weight: 600; line-height: 1; }
  .score-msg { margin-top: 0.5rem; color: var(--muted); }

  @media (prefers-reduced-motion: no-preference) {
    .scroll-progress span { transition: transform 80ms linear; }
  }
</style>
</head>
<body>

<div class="scroll-progress" aria-hidden="true"><span id="scrollBar"></span></div>

<div class="wrap">
  <header>
    <h1>How well do you know America?</h1>
    <p class="intro">Thirteen questions about how Americans live, earn, and get by. Pick one answer for each, then check your answers to see how you did and where the numbers come from.</p>
  </header>

  <ol class="questions" id="quiz"></ol>

  <div class="submit-area">
    <p class="answered" id="answered">0 of 13 answered</p>
    <button id="submitBtn" disabled>Check my answers</button>
    <div class="score" id="score" hidden>
      <div class="score-num" id="scoreNum"></div>
      <p class="score-msg" id="scoreMsg"></p>
    </div>
  </div>
</div>

const letters = ["A", "B", "C"];
const answers = new Array(questions.length).fill(null);
const quiz = document.getElementById("quiz");

function figureHTML(f) {
  return `<figure>
    <img src="${f.src}" alt="${f.label}" onerror="this.replaceWith(Object.assign(document.createElement('div'), {className: 'placeholder', textContent: 'Add image: ${f.src.startsWith('data:') ? f.label : f.src}'}))">
    <figcaption>${f.label}</figcaption>
  </figure>`;
}

questions.forEach((q, qi) => {
  const li = document.createElement("li");
  li.className = "card";
  li.id = "q" + qi;
  li.innerHTML = `
    <p class="q-num">Question ${qi + 1} of ${questions.length}</p>
    <p class="q-text" id="qt${qi}">${q.text}</p>
    ${q.note ? `<p class="q-note">${q.note}</p>` : ""}
    ${q.figures ? `<div class="figures">${q.figures.map(figureHTML).join("")}</div>` : ""}
    <div class="options" role="radiogroup" aria-labelledby="qt${qi}">
      ${q.options.map((opt, oi) => `
        <label class="option" id="opt-${qi}-${oi}">
          <input type="radio" name="q${qi}" value="${oi}">
          <span class="letter">${letters[oi]}</span>
          <span>${opt}</span>
        </label>`).join("")}
    </div>`;
  li.querySelectorAll("input").forEach(inp =>
    inp.addEventListener("change", () => record(qi, Number(inp.value)))
  );
  quiz.appendChild(li);
});

function record(qi, oi) {
  answers[qi] = oi;
  const count = answers.filter(a => a !== null).length;
  document.getElementById("answered").textContent = `${count} of ${questions.length} answered`;
  document.getElementById("submitBtn").disabled = count < questions.length;
}

document.getElementById("submitBtn").addEventListener("click", () => {
  let score = 0, graded = 0;

  questions.forEach((q, qi) => {
    const card = document.getElementById("q" + qi);
    card.classList.add("locked");
    card.querySelectorAll("input").forEach(i => i.disabled = true);

    let verdict;
    if (q.correct === null) {
      card.classList.add("is-pending");
      verdict = "Not scored yet";
    } else {
      graded++;
      const right = answers[qi] === q.correct;
      if (right) score++;
      card.classList.add(right ? "is-right" : "is-wrong");
      document.getElementById(`opt-${qi}-${q.correct}`).classList.add("correct-answer");
      if (!right) document.getElementById(`opt-${qi}-${answers[qi]}`).classList.add("picked-wrong");
      verdict = right ? "Correct" : `Not quite. The answer is ${letters[q.correct]}: ${q.options[q.correct]}.`;
    }

    const sources = q.sources.length
      ? `<p class="sources">Source: ${q.sources.map(s => s.url ? `<a href="${s.url}" target="_blank" rel="noopener">${s.label}</a>` : s.label).join("; ")}</p>`
      : "";
    const fb = document.createElement("div");
    fb.className = "feedback";
    fb.innerHTML = `<p class="verdict">${verdict}</p><p class="explain">${q.explain}</p>${sources}`;
    card.appendChild(fb);
  });

  const pct = score / graded;
  let msg;
  if (pct === 1) msg = "A perfect score. You know America better than most Americans do.";
  else if (pct >= 0.7) msg = "Strong result. A few numbers still surprised you.";
  else if (pct >= 0.4) msg = "About what most people score. Read the answers above for the surprises.";
  else msg = "America looks different in the data than in the headlines. The answers above explain why.";

  document.getElementById("scoreNum").textContent = `${score} / ${graded}`;
  const pending = questions.length - graded;
  document.getElementById("scoreMsg").textContent = msg;
  const box = document.getElementById("score");
  box.hidden = false;
  document.getElementById("submitBtn").disabled = true;
  box.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "nearest" });
  updateBar();
});

const bar = document.getElementById("scrollBar");
function updateBar() {
  const el = document.documentElement;
  const max = el.scrollHeight - el.clientHeight;
  bar.style.transform = `scaleX(${max > 0 ? Math.min(el.scrollTop / max, 1) : 1})`;
}
window.addEventListener("scroll", updateBar, { passive: true });
window.addEventListener("resize", updateBar);
updateBar();
</script>
